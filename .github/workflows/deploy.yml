name: Deploy to Hetzner

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: bronzebrawl-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          DEPLOY_PATH: ${{ secrets.HETZNER_DEPLOY_PATH }}
          DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_REPO: https://github.com/JanSHecker/BronzeBrawl.git
        run: |
          ssh ${HETZNER_USER}@${HETZNER_HOST} "mkdir -p ${DEPLOY_PATH}"
          ssh ${HETZNER_USER}@${HETZNER_HOST} "set -euo pipefail; if [ ! -d '${DEPLOY_PATH}/.git' ]; then git clone '${DEPLOY_REPO}' '${DEPLOY_PATH}'; fi; cd '${DEPLOY_PATH}'; git fetch origin main; if [ \"\$(git rev-parse origin/main)\" != '${DEPLOY_REVISION}' ]; then echo 'Skipping superseded CI revision'; exit 0; fi; if [ -n \"\$(git status --porcelain)\" ]; then echo 'Refusing deployment: working tree has local changes.' >&2; exit 1; fi; git merge-base --is-ancestor '${DEPLOY_REVISION}' origin/main; git switch --detach '${DEPLOY_REVISION}'; DEPLOY_REVISION='${DEPLOY_REVISION}' bash scripts/deploy.sh"
