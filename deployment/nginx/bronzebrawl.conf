server {
    listen 80;
    listen [::]:80;
    server_name bronze-brawl.de www.bronze-brawl.de;

    # Keep /api out of the SPA location. The trailing slash on proxy_pass strips
    # the public prefix so /api/health reaches the backend as /health.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # Match the backend's bounded JSON snapshot limit (4 MiB).
        client_max_body_size 4m;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
