version: '3'
services:
  frontend:
    build: 
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:3000

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SIPS_PER_SHOT: ${SIPS_PER_SHOT:-5}
      SIPS_PER_CHUG: ${SIPS_PER_CHUG:-15}
      DIFFICULTY_EASY: ${DIFFICULTY_EASY:-0.5}
      DIFFICULTY_BASELINE: ${DIFFICULTY_BASELINE:-1}
      DIFFICULTY_HARD: ${DIFFICULTY_HARD:-1.5}
      DIFFICULTY_TERROR: ${DIFFICULTY_TERROR:-2}
      REWARD_CATALOG_OVERRIDES: ${REWARD_CATALOG_OVERRIDES:-}

  postgres:
    image: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
